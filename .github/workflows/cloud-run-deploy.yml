name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # or master, depending on your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate with Google Cloud using a Service Account JSON Key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gcr.io/${{ steps.auth.outputs.project_id }}/hyperspec-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy the pre-built image to Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: hyperspec-app
          region: us-central1
          image: gcr.io/${{ steps.auth.outputs.project_id }}/hyperspec-app:${{ github.sha }}
          flags: '--memory=2Gi --allow-unauthenticated'
